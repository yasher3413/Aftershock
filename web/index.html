<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Overpass:wght@400;500;600;700&display=swap"
    />
    <meta
      name="description"
      content="Every goal in the NHL is an earthquake. See how far it travels."
    />
    <meta name="theme-color" content="#eef3f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1822" media="(prefers-color-scheme: dark)" />
    <title>Puckquake</title>
    <script>
      // A cached page from before a deploy can name app files that are gone;
      // reload once (at most every minute) to get the current page.
      window.addEventListener(
        "error",
        function (e) {
          var t = e.target;
          if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
          var src = t.src || t.href;
          if (!src || src.indexOf("/assets/") < 0) return;
          try {
            var k = "aftershock.reloadedForDeploy";
            if (Date.now() - Number(sessionStorage.getItem(k) || 0) < 60000) return;
            sessionStorage.setItem(k, String(Date.now()));
          } catch (_) {}
          location.reload();
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
