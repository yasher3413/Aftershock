[project]
name = "aftershock"
version = "0.1.0"
description = "Live NHL playoff-odds engine: ingest, models, simulator bindings, API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "typer>=0.13",
    "polars>=1.14",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "cairosvg>=2.7",
    "anthropic>=0.40",
    "tzdata>=2024.2",
]

[project.scripts]
aftershock = "aftershock.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "maturin>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aftershock"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Batch jobs run alone; blocking file reads inside them are fine.
"aftershock/jobs/*" = ["ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs a Postgres database (TEST_DATABASE_URL)",
    "network: hits the real NHL API",
]
addopts = "-m 'not network'"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
