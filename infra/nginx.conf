server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The plain app shell, also the fallback when the api is down.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Pages go through the api so link previews (which run no JavaScript)
    # see each page's title, description, and share image.
    location / {
        try_files $uri @page;
    }

    location @page {
        proxy_pass http://api:8000/page$uri;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = /index.html;
    }
}
