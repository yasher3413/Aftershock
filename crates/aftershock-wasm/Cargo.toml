[package]
name = "aftershock-wasm"
description = "WebAssembly build of aftershock-core for the What-If Lab"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Single threaded: no `parallel` feature (no rayon) in the browser build.
aftershock-core = { path = "../aftershock-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# wasm-opt from some binaryen releases corrupts wasm-bindgen's function table
# ("WebAssembly.Table.grow(): failed to grow table"), so ship the unoptimized
# build; it is small and fast enough.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
