[package]
name = "aftershock-py"
description = "Python bindings for aftershock-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "aftershock_py"
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin (see pyproject.toml). Off for `cargo test`, so test
# binaries link against libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
aftershock-core = { path = "../aftershock-core" }
pyo3 = "0.29"
numpy = "0.29"
